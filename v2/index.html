<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Klangwerkstatt v2 🎵</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
/* ===== DARK HARDWARE THEME ===== */
:root {
  --bg: #0d0f11; --surface: #16191d; --raised: #1e2228;
  --border: #2a2e36; --text: #e0e2e6; --dim: #6b7280;
  --magenta: #e04090; --cyan: #3bc9db; --amber: #f59e0b;
  --green: #10b981; --red: #ef4444; --purple: #a855f7;
  --kick: #ff5d5d; --snare: #4d9fff; --hat: #3ecf8e;
  --perc: #ffc93c; --melodic: #a06cd5;
  --radius: 8px; --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  -webkit-user-select: none; user-select: none;
}
/* ===== LAYOUT ===== */
#app { display: flex; flex-direction: column; height: 100vh; }
#toolbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
#toolbar h1 { font-size: 1.1em; font-weight: 700; background: linear-gradient(135deg, var(--magenta), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#transport { display: flex; gap: 6px; margin-left: auto; }
.btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--raised); color: var(--text); font-family: inherit; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: all 0.1s; }
.btn:hover { border-color: var(--magenta); }
.btn:active { transform: scale(0.96); }
.btn.play { background: var(--green); border-color: var(--green); color: #000; }
.btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
.btn.rec { background: var(--magenta); border-color: var(--magenta); color: #fff; }
#bpm-display { font-size: 1.4em; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 50px; text-align: center; }
#bpm-slider { width: 100px; accent-color: var(--magenta); }
/* ===== MAIN GRID ===== */
#main {
  display: grid; grid-template-columns: 1fr 280px; grid-template-rows: 1fr auto;
  flex: 1; gap: 8px; padding: 8px; overflow: hidden;
}
/* ===== PAD GRID ===== */
#pads-panel {
  grid-column: 1; grid-row: 1;
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto;
}
#pad-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  flex: 1; align-content: start;
}
.pad {
  aspect-ratio: 1; border-radius: var(--radius-lg); border: 2px solid var(--border);
  background: var(--raised); cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; transition: all 0.08s; overflow: hidden;
}
.pad:hover { border-color: var(--dim); }
.pad:active, .pad.playing { transform: scale(0.94); border-color: var(--magenta); box-shadow: 0 0 24px rgba(224,64,144,.4); }
.pad .emoji { font-size: 1.6em; }
.pad .name { font-size: 0.7em; color: var(--dim); margin-top: 2px; text-align: center; line-height: 1.2; }
.pad.selected { border-color: var(--cyan); box-shadow: 0 0 16px rgba(59,201,219,.3); }
/* ===== LIBRARY PANEL ===== */
#library-panel {
  grid-column: 2; grid-row: 1 / 3;
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto;
}
#library-panel h2 { font-size: 0.95em; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#lib-search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--raised); color: var(--text); font-family: inherit; font-size: 0.9em; }
#lib-filters { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 16px;
  background: var(--raised); color: var(--dim); font-size: 0.75em;
  cursor: pointer; font-family: inherit; font-weight: 600;
}
.chip.active { background: var(--magenta); color: #fff; border-color: var(--magenta); }
#lib-list { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; flex: 1; }
.lib-item {
  padding: 7px 10px; border-radius: var(--radius); cursor: pointer;
  font-size: 0.82em; display: flex; align-items: center; gap: 8px;
  transition: background 0.1s;
}
.lib-item:hover { background: var(--raised); }
.lib-item .li-emoji { font-size: 1.1em; }
.lib-item .li-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-item .li-type { font-size: 0.75em; color: var(--dim); }
.lib-item .li-pack { font-size: 0.65em; color: var(--dim); }
/* ===== SEQUENCER ===== */
#seq-panel {
  grid-column: 1; grid-row: 2;
  background: var(--surface); border-radius: var(--radius-lg);
  padding: 10px 12px; overflow-x: auto;
}
.seq-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
}
.seq-label {
  width: 60px; font-size: 0.8em; font-weight: 600; text-align: right;
  padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seq-steps { display: flex; gap: 3px; }
.seq-step {
  width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--raised); cursor: pointer; transition: all 0.06s;
}
.seq-step.on { background: var(--magenta); border-color: var(--magenta); }
.seq-step.current { border-color: var(--cyan); box-shadow: 0 0 8px rgba(59,201,219,.4); }
.seq-step:nth-child(4n+1) { border-left-width: 2px; border-left-color: var(--dim); }
/* ===== FX RACK ===== */
#fx-rack {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 16px; display: flex; gap: 20px; z-index: 10;
}
.fx-slot { display: flex; align-items: center; gap: 8px; font-size: 0.82em; }
.fx-slot label { color: var(--dim); min-width: 50px; }
.fx-slot input[type=range] { width: 80px; accent-color: var(--cyan); }
/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  #main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  #library-panel { grid-column: 1; grid-row: 3; max-height: 200px; }
  #pad-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>🎵 Klangwerkstatt</h1>
    <span id="bpm-display">100</span>
    <input type="range" id="bpm-slider" min="60" max="180" value="100">
    <div id="transport">
      <button class="btn play" id="btn-play">▶ Play</button>
      <button class="btn stop" id="btn-stop">⏹ Stop</button>
    </div>
  </div>

  <div id="main">
    <!-- PADS -->
    <div id="pads-panel">
      <div id="pad-grid"></div>
    </div>

    <!-- LIBRARY -->
    <div id="library-panel">
      <h2>📦 Library</h2>
      <input type="text" id="lib-search" placeholder="Samples durchsuchen...">
      <div id="lib-filters">
        <button class="chip active" data-type="">Alle</button>
        <button class="chip" data-type="kick">🥁 Kick</button>
        <button class="chip" data-type="snare">👏 Snare</button>
        <button class="chip" data-type="hat">✨ Hat</button>
        <button class="chip" data-type="loop">🔄 Loop</button>
        <button class="chip" data-type="melodic">🎹 Melodic</button>
      </div>
      <div id="lib-list"></div>
    </div>

    <!-- SEQUENCER -->
    <div id="seq-panel">
      <div id="seq-rows"></div>
    </div>
  </div>

  <!-- FX RACK -->
  <div id="fx-rack">
    <div class="fx-slot"><label>🌀 Delay</label><input type="range" id="fx-delay" min="0" max="100" value="0"></div>
    <div class="fx-slot"><label>🏰 Reverb</label><input type="range" id="fx-reverb" min="0" max="100" value="15"></div>
    <div class="fx-slot"><label>💥 Drive</label><input type="range" id="fx-drive" min="0" max="100" value="0"></div>
    <div class="fx-slot"><label>🔊 Vol</label><input type="range" id="fx-vol" min="0" max="100" value="80"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.0.4/Tone.min.js"></script>
<script src="v2/engine.js"></script>
</body>
</html>
